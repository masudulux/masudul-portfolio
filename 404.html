<style>
:root{--bg:#0f110f;--surface:#171a17;--fg:#ecefe9;--muted:#9aa096;--line:#2a2e29;--accent:#ff7a45;--select:#5b8cff}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f4;--surface:#fff;--fg:#141613;--muted:#62675f;--line:#dfe2dc;--accent:#f25a1d;--select:#2f6bff}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 Geist,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{max-width:520px;text-align:left}
.code{font:400 13px "Geist Mono",ui-monospace,monospace;color:var(--muted);letter-spacing:.04em}
h1{font:700 clamp(40px,9vw,64px)/1.02 "Bricolage Grotesque",system-ui,sans-serif;margin:12px 0 16px;letter-spacing:-.02em}
h1 span{position:relative;display:inline-block;padding:0 6px;outline:1.5px solid var(--select);outline-offset:2px}
p{color:var(--muted);margin:0 0 28px}
nav{display:flex;flex-wrap:wrap;gap:12px}
a{color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:500}
a:hover,a:focus-visible{border-color:var(--accent);color:var(--accent)}
a.primary{background:var(--accent);border-color:var(--accent);color:#0f110f}
a.primary:hover{color:#0f110f;filter:brightness(1.08)}
</style>
