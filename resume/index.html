    const tl = new TextLayer({ textContentSource: textContent, container: textDiv, viewport: vp });
    await tl.render();
    textDiv.style.width = '100%'; textDiv.style.height = '100%';
  } catch (e) {}
  // Clickable links (email, LinkedIn, portfolio, Behance, Medium)
  if (linksDiv) linksDiv.remove();
  linksDiv = document.createElement('div');
  linksDiv.className = 'links';
  for (const a of annots) {
    if (a.subtype !== 'Link' || !(a.url || a.unsafeUrl)) continue;
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
    const el = document.createElement('a');
    el.href = a.url || a.unsafeUrl;
    el.target = '_blank'; el.rel = 'noopener';
    el.setAttribute('aria-label', el.href.replace(/^mailto:/, 'Email ').replace(/^https?:\/\//, ''));
    Object.assign(el.style, {
      left: (Math.min(x1, x2) / vp.width * 100) + '%', top: (Math.min(y1, y2) / vp.height * 100) + '%',
      width: (Math.abs(x2 - x1) / vp.width * 100) + '%', height: (Math.abs(y2 - y1) / vp.height * 100) + '%'
    });
    linksDiv.appendChild(el);
  }
  paper.appendChild(linksDiv);
}

try {
  const lib = await import('/assets/pdfjs/pdf.min.mjs');
  window.pdfjsLib = lib;
  lib.GlobalWorkerOptions.workerSrc = '/assets/pdfjs/pdf.worker.min.mjs';
  const doc = await lib.getDocument({ url: PDF, isEvalSupported: false }).promise;
  page = await doc.getPage(1);
  base = page.getViewport({ scale: 1 });
  [textContent, annots] = await Promise.all([page.getTextContent(), page.getAnnotations()]);
  setScale(fitScale(), true);

  zoomBtns.forEach(b => b.addEventListener('click', () => {
    const dir = +b.dataset.zoom;
    const next = dir > 0 ? STEPS.find(s => s > scale + 1e-3) : [...STEPS].reverse().find(s => s < scale - 1e-3);
    if (next) setScale(next);
  }));
  pctBtn.addEventListener('click', () => setScale(fitScale(), true));
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === '+' || e.key === '=') zoomBtns[1].click();
    else if (e.key === '-' || e.key === '_') zoomBtns[0].click();
    else if (e.key === '0') pctBtn.click();
  });
  let lastW = innerWidth;
  addEventListener('resize', () => { if (fitMode && innerWidth !== lastW) { lastW = innerWidth; setScale(fitScale(), true); } });
  matchMedia('(resolution: 1dppx)').addEventListener?.('change', () => draw());
} catch (e) {
  paper.classList.add('failed'); // the poster image stays visible
  pctBtn.textContent = '100%';
  document.querySelectorAll('.dock .zoom').forEach(el => el.style.display = 'none');
}
</script>
